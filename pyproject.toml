[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-celery-broker"
version = "0.2.0"
description = "Production-ready distributed execution backend for Google Agent ADK with injectable A2A task store and session service."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "google-adk>=1.0.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "fastapi>=0.110.1",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/sthitaprajnas/adk-celery-executor"
Repository = "https://github.com/sthitaprajnas/adk-celery-executor"
